<!-- Grid System -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Grid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
  <h2 class="text-center mb-4">Bootstrap Grid System</h2>

  <div class="row">
    <div class="col-md-4 bg-primary text-white p-3">Column 1</div>
    <div class="col-md-4 bg-success text-white p-3">Column 2</div>
    <div class="col-md-4 bg-danger text-white p-3">Column 3</div>
  </div>

  <div class="row mt-3">
    <div class="col-sm-6 bg-warning p-3">50% width</div>
    <div class="col-sm-6 bg-info text-white p-3">50% width</div>
  </div>
</div>

</body>
</html>
